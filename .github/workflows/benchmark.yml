name: benchmark

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Benchmark HEAD (speed)
        run: python benchmarks/nii_poi/bench_speed.py --quick --json head.json

      - name: Benchmark HEAD (memory)
        run: python benchmarks/nii_poi/bench_mem.py --quick --json head_mem.json

      - name: Benchmark baseline (base commit's TPTBox, HEAD's harness)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          # Only the TPTBox/ tree is swapped. benchmarks/ stays at HEAD so the
          # workloads, repeats, warmup and JSON schema are identical on both
          # sides — otherwise the comparison measures the harness, not the code.
          cp -a TPTBox /tmp/TPTBox-head
          # Nuke first, then repopulate from base. A plain `git checkout base --`
          # leaves behind files that are new in HEAD, and the resulting mix of
          # old and new modules fails with TypeError on unknown kwargs.
          rm -rf TPTBox
          git checkout ${{ github.event.pull_request.base.sha }} -- TPTBox
          python benchmarks/nii_poi/bench_speed.py --quick --json baseline.json
          python benchmarks/nii_poi/bench_mem.py --quick --json baseline_mem.json
          rm -rf TPTBox
          cp -a /tmp/TPTBox-head TPTBox

      - name: Compare against on-runner baseline
        id: compare
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set +e
          python benchmarks/nii_poi/compare.py baseline.json head.json \
            --fail-on-regression-pct 50 > speed.md
          speed_status=$?
          python benchmarks/nii_poi/compare_mem.py baseline_mem.json head_mem.json \
            --fail-on-regression-pct 50 > mem.md
          mem_status=$?

          {
            echo '<!-- tptbox-benchmark -->'
            echo '# Benchmark comparison'
            echo ''
            cat speed.md
            echo ''
            cat mem.md
          } > comparison.md

          cat comparison.md >> "$GITHUB_STEP_SUMMARY"

          status=0
          if [ "$speed_status" -ne 0 ] || [ "$mem_status" -ne 0 ]; then
            status=1
          fi
          echo "compare_status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Post/update PR comment
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              body = fs.readFileSync('comparison.md', 'utf8');
            } catch (e) {
              core.warning(`comparison.md missing (${e.message}); skipping PR comment.`);
              return;
            }
            const marker = '<!-- tptbox-benchmark -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

      - name: Fail on regression
        if: github.event_name == 'pull_request'
        shell: bash
        run: exit "${{ steps.compare.outputs.compare_status }}"

      - name: Head-only summary (workflow_dispatch)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          {
            echo '# Benchmark (head only)'
            echo ''
            echo 'No baseline to compare against on a manual run; raw numbers are in the artifacts.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            head.json
            head_mem.json
            baseline.json
            baseline_mem.json
            comparison.md
          if-no-files-found: ignore
