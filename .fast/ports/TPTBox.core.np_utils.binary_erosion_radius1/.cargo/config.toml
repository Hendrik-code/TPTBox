# Built for the machine that runs it: .fast/lib is rebuilt per machine, never shipped.
[build]
rustflags = ["-C", "target-cpu=native"]

# Extensions on macOS resolve the host's symbols at load time.
[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=native", "-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=native", "-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]
